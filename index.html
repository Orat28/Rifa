<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcador Rifa</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#4caf50" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <!-- Pantalla de Ingreso de PIN -->
  <div class="pin-overlay" id="pinOverlay">
    <div class="pin-box">
      <h3>Acceso a Vendedores</h3>
      <p style="font-size: 0.9rem; color: #666;">Ingresa el PIN para gestionar la rifa:</p>
      <input type="password" id="pinInput" maxlength="4" placeholder="****" />
      <button class="btn btn-primary" style="width: 100%;" onclick="checkPin()">Ingresar</button>
    </div>
  </div>

  <header>
    <input type="text" id="titleInput" value="Rifa Logística" />
    <div class="counter-badge">
      Vendidos: <span id="soldCount">0</span> / 200
    </div>
  </header>

  <!-- TABLERO PRINCIPAL -->
  <div class="grid-container">
    <div class="grid" id="grid"></div>
  </div>

  <!-- CONTROLES DE FILTRO Y EXPORTACIÓN -->
  <div class="controls-bar">
    <div class="filter-buttons">
      <button class="btn-filter active" onclick="setFilter('all', this)">Todos</button>
      <button class="btn-filter" onclick="setFilter('free', this)">Libres</button>
      <button class="btn-filter" onclick="setFilter('sold', this)">Vendidos</button>
    </div>
    <div class="export-buttons">
      <button class="btn-export" onclick="exportToCSV()">Excel (CSV)</button>
      <button class="btn-export" style="background:#ff9800; border-color:#e65100;" onclick="exportToPDF()">Imprimir / PDF</button>
      <button class="btn-export" style="background:#e53935; border-color:#b71c1c;" onclick="resetRaffle()">Reiniciar Rifa</button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Número #001</h3>
      <div class="form-group">
        <label for="buyerInput">Nombre del Comprador:</label>
        <input type="text" id="buyerInput" placeholder="Ej: Juan Pérez" />
      </div>
      <div class="form-group">
        <label for="sellerInput">Nombre del Vendedor:</label>
        <input type="text" id="sellerInput" placeholder="Ej: María" />
      </div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- Lógica Principal -->
  <script src="script.js"></script>

</body>
</html>
